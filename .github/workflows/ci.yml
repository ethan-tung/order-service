name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: |
          dotnet restore src/OrderService.Api/OrderService.Api.csproj
      - name: Build
        run: |
          dotnet build src/OrderService.Api/OrderService.Api.csproj -c Release --no-restore
      - name: Test
        run: echo "No tests configured yet"

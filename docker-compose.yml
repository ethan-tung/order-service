version: '3.8'

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: devpass
      MYSQL_DATABASE: orders_db
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

  flowable:
    image: flowable/flowable-engine:8
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/flowable
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=devpass
    ports:
      - "8888:8888"
    depends_on:
      - mysql

  order-api:
    build:
      context: .
      dockerfile: src/OrderService.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=server=mysql;port=3306;user=root;password=devpass;database=orders_db;
      - RabbitMQ__Host=rabbitmq
    ports:
      - "5000:80"
    depends_on:
      - mysql
      - redis
      - rabbitmq

  order-worker:
    build:
      context: .
      dockerfile: src/OrderService.Api/Dockerfile
    command: dotnet OrderService.Worker.dll
    depends_on:
      - rabbitmq
